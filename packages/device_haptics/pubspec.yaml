name: device_haptics
description: "Device haptics APIs for the Device Playground"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.44.9"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: 6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.device_haptics
        pluginClass: DeviceHapticsPlugin
      ios:
        pluginClass: IosCoreHapticsPlugin
